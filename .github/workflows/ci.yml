name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  COLUMNS: "512"

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: create isolated environment
        run: python -m venv .venv
      - name: install test tooling
        run: .venv/bin/python -m pip install --upgrade pip "pytest>=8"
      - name: install package without extras
        run: .venv/bin/python -m pip install .
      - name: prove zero runtime dependencies
        run: |
          .venv/bin/python - <<'PY'
          from importlib.metadata import requires

          declared = requires("pausanias")
          if declared is None:
              raise SystemExit("pausanias metadata has no Requires-Dist entries")

          def is_optional_extra(value):
              _, separator, marker = value.partition(";")
              if not separator:
                  return False
              return "".join(marker.split()) in {
                  'extra=="dev"',
                  'extra=="semantic"',
                  "extra=='dev'",
                  "extra=='semantic'",
              }

          base = [value for value in declared if not is_optional_extra(value)]
          print("declared requirements:", ", ".join(declared) or "none")
          if base:
              raise SystemExit(f"base requirements declared: {base}")
          PY
      - name: run tests
        run: .venv/bin/python -m pytest -q

  semantic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: create isolated environment
        run: python -m venv .venv
      - name: install test tooling
        run: .venv/bin/python -m pip install --upgrade pip "pytest>=8"
      - name: install semantic profile
        run: .venv/bin/python -m pip install ".[semantic]"
      - name: run tests
        run: .venv/bin/python -m pytest -q
